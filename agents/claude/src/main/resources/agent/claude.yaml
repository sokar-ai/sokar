# Claude Code.
#
# Everything here is data. The one thing that is not - reading an OAuth token out
# of the credentials file Claude writes at login - is a method override in
# ClaudeAgent, in this module, rather than a branch somewhere in Sokar.

name: claude
label: Claude Code
binary: claude

# Where this agent keeps its own credentials on the host, for 'sokar vault import'.
config_dir: "~/.claude"

git_identity:
  name: Claude
  email: noreply@anthropic.com

headless:
  prompt_flag: "-p"
  model_flag: "--model"
  max_turns_flag: "--max-turns"
  verbose_flag: "--verbose"
  # --verbose is not optional here: Claude Code refuses stream-json in print mode without
  # it ("--output-format=stream-json requires --verbose"). It belongs in this list rather
  # than being requested separately, because it is part of what machine-readable output
  # costs for THIS agent, and another agent's answer will differ.
  output_format_flags: ["--output-format", "stream-json", "--verbose"]

session:
  supports_resume: true
  resume_flag: "--resume"

provider:
  # Anthropic's half - upstream, headers, prefixes, the variable a credential goes in - is
  # declared once in providers/anthropic.yaml and not repeated here. What is left is only what
  # belongs to this agent.
  default: anthropic

  # One wire format wherever it points, unlike a provider-agnostic agent that speaks whichever
  # its provider does.
  dialect: anthropic-messages

  # A socket: a file the container mounts, invisible to anything that cannot open it. It needs no
  # firewall hole, no plaintext hop across the namespace boundary, and its 0600 permissions are
  # the access control. An agent that can only be given a URL declares 'url' instead and is
  # served by a relay in its own network namespace.
  endpoint: socket
  socket_env: ANTHROPIC_UNIX_SOCKET

  # Both are set on purpose. The socket variable only selects the transport; without the base
  # URL, Claude Code falls back to its compiled-in endpoint - measured, it then resolved
  # api.anthropic.com 184 times in one run and never touched the socket.
  base_url_env: ANTHROPIC_BASE_URL

# api.anthropic.com is not listed: the provider declares its own host, and it is withheld from
# the firewall while the proxy is in use so that an agent ignoring the redirect shows up as a
# dropped connection rather than as an unexplained authentication error.
allowed_domains:
  # Contacted before an interactive session starts. Without it the CLI reports it cannot
  # reach Anthropic and quits, whatever the credential is.
  - platform.claude.com
  - claude.ai
  - statsig.anthropic.com

# Names Claude Code asks for that it does NOT get. Listed rather than simply left out of
# allowed_domains, because the two cases look identical to the firewall and completely
# different to a reviewer: an undeclared name is usually a bug that breaks the agent for
# everyone, while these are a deliberate refusal. The domain-coverage test in
# buildtools/e2e-tier1.sh uses this list to tell them apart, and 'sokar agents --verbose'
# shows it, so an operator can see what is being blocked rather than discovering it in a
# drop log.
#
# Found by measurement, not from documentation: 2.1.236 resolves the Datadog intake below
# during a normal run. The CLI works without it. It also asks for raw.githubusercontent.com,
# which is not granted either: allowing it opens every file on that host to the agent, and
# nothing needed to start a session comes from there.
refused_domains:
  - http-intake.logs.us5.datadoghq.com
  - raw.githubusercontent.com

install:
  # Pinned, not "latest". Anthropic publishes a per-version manifest.json carrying a
  # SHA-256 per platform, so this is verifiable rather than trusted:
  #   https://downloads.claude.ai/claude-code-releases/<version>/manifest.json
  #
  # Bumping it is a one-line change plus the new digest, and until it is bumped every
  # image build installs the same bytes. `sokar agents --supply-chain` reports what is
  # pinned here, so "which version ran" is answerable from the definition rather than
  # from a build log that may no longer exist.
  version: "${agent.cli.version}"
  artifacts:
    - url: https://downloads.claude.ai/claude-code-releases/${agent.cli.version}/linux-x64/claude
      sha256: "6c8818fa22187aa555c242be4abbacc44d6b71a32ac9631ee7b2b5d12f51f752"
      target: /home/agent/.local/bin/claude
      mode: "0755"
