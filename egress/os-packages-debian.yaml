# apt on a Debian or Ubuntu base image. These are CDN names that stay put, so the set covers an
# install rather than merely starting one.
name: os-packages-debian
label: Debian and Ubuntu packages
domains:
  - deb.debian.org
  - security.debian.org
  # The CDN Sokar's own default reaches first. Here too, or a task that installs a package
  # at RUNTIME is refused by the firewall for using the source the image was built from.
  - azure.archive.ubuntu.com
  - archive.ubuntu.com
  - security.ubuntu.com
  - ports.ubuntu.com
