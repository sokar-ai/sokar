<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 112" width="128" height="112" role="img" aria-labelledby="t">
  <title id="t">A little robot peeking out of its sandbox</title>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- sparks of enthusiasm -->
    <g fill="#f2a93b" stroke="none">
      <path d="M104 20 Q104 26 110 26 Q104 26 104 32 Q104 26 98 26 Q104 26 104 20 Z"/>
      <path d="M22 30 Q22 35 27 35 Q22 35 22 40 Q22 35 17 35 Q22 35 22 30 Z"/>
    </g>

    <!-- antenna -->
    <path d="M64 18 V9" stroke="#3f8f88" stroke-width="3"/>
    <circle cx="64" cy="6" r="4.5" fill="#f2a93b" stroke="#c9821f" stroke-width="2"/>

    <!-- head, mostly hidden by the box in front of it -->
    <rect x="40" y="16" width="48" height="46" rx="13" fill="#4db6ac" stroke="#3f8f88" stroke-width="3"/>
    <circle cx="45" cy="43" r="3.5" fill="#ef8a7f" stroke="none" opacity="0.75"/>
    <circle cx="83" cy="43" r="3.5" fill="#ef8a7f" stroke="none" opacity="0.75"/>
    <circle cx="54" cy="36" r="6.5" fill="#fdfdfb" stroke="#2c5f5a" stroke-width="2"/>
    <circle cx="55" cy="37" r="2.8" fill="#2c5f5a" stroke="none"/>
    <!-- the other eye is winking, because it knows what it is being kept in -->
    <path d="M68 39 q6 -8 12 0" stroke="#2c5f5a" stroke-width="3"/>
    <path d="M53 47 q11 9 22 0" stroke="#2c5f5a" stroke-width="3"/>

    <!-- the sandbox -->
    <rect x="12" y="52" width="104" height="52" rx="9" fill="#cfd8dc" stroke="#78909c" stroke-width="3"/>
    <path d="M12 66 H116" stroke="#78909c" stroke-width="2" opacity="0.55"/>

    <!-- powered by -->
    <path d="M69 72 L57 87 L65 87 L59 99 L75 83 L66 83 Z" fill="#f2a93b" stroke="#c9821f" stroke-width="2"/>

    <!-- hands on the rim -->
    <rect x="23" y="45" width="17" height="12" rx="6" fill="#4db6ac" stroke="#3f8f88" stroke-width="3"/>
    <rect x="88" y="45" width="17" height="12" rx="6" fill="#4db6ac" stroke="#3f8f88" stroke-width="3"/>
  </g>
</svg>
