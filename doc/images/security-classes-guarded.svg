<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Guarded: the agent pushes to the local gate, the operator reviews there and approves, and only the approve reaches the upstream. The agent never reaches the upstream itself; the gate on the host fetches from it at the task's start and on sokar task refresh. Alongside it, dashed, the path by which unreviewed work leaves without ever passing the approval.">
  <rect x="0" y="0" width="880" height="330" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8480f"/>
    </marker>
    <marker id="review" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6b56"/>
    </marker>
    <marker id="danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3261e"/>
    </marker>
  </defs>
  <g font-family="'Fira Sans','DejaVu Sans',sans-serif">
    <rect x="16" y="22" width="404" height="164" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="30" y="42" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">NODE</text>
    <rect x="34" y="60" width="150" height="46" rx="6" fill="#e6f2ee" stroke="#1a6b56" stroke-width="2"/>
    <text x="109" y="81" font-size="13" text-anchor="middle" fill="#24292f" font-weight="bold">Operator</text>
    <text x="109" y="98" font-size="10.5" text-anchor="middle" fill="#1a6b56">reads, approves</text>
    <g fill="#d4880f"><rect x="124" y="128" width="7" height="22" rx="1.5"/><rect x="136" y="128" width="7" height="22" rx="1.5"/></g>
    <text x="152" y="138" font-size="11.5" fill="#a86a0b" font-weight="bold">work waits</text>
    <text x="152" y="152" font-size="10.5" fill="#a86a0b">until a person approves it</text>
    <rect x="240" y="60" width="160" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="320" y="82" font-size="13" text-anchor="middle" fill="#24292f">Gate + mirror</text>
    <text x="320" y="98" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="'IBM Plex Mono',monospace">refs/sokar/incoming/…</text>
    <rect x="470" y="34" width="210" height="140" rx="8" fill="none" stroke="#e0a281"/>
    <text x="484" y="54" font-size="11" fill="#a8480f" font-family="'IBM Plex Mono',monospace">CONTAINER</text>
    <rect x="492" y="66" width="166" height="42" rx="6" fill="none" stroke="#a8480f"/>
    <text x="575" y="92" font-size="13" text-anchor="middle" fill="#a8480f">Agent</text>
    <text x="575" y="132" font-size="11" text-anchor="middle" fill="#57606a">declared names only</text>
    <text x="575" y="150" font-size="11" text-anchor="middle" fill="#57606a">ports 80/443 · no key</text>
    <rect x="726" y="60" width="136" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="794" y="88" font-size="13" text-anchor="middle" fill="#24292f">Upstream</text>
    <path d="M 404 74 L 486 74" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="66" font-size="11" text-anchor="middle" fill="#a8480f">clones</text>
    <path d="M 486 96 L 404 96" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="112" font-size="11" text-anchor="middle" fill="#a8480f">pushes</text>
    <path d="M 236 83 L 190 83" stroke="#1a6b56" stroke-width="1.6" fill="none" marker-end="url(#review)"/>
    <text x="212" y="74" font-size="10.5" text-anchor="middle" fill="#1a6b56">review</text>
    <text x="575" y="166" font-size="11" text-anchor="middle" fill="#57606a">no route to the upstream</text>
    <path d="M 300 110 L 300 206 L 774 206 L 774 112" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#review)"/>
    <text x="537" y="199" font-size="11.5" text-anchor="middle" fill="#1a6b56">only after approval: exactly the ref that was read, with the host's key</text>
    <path d="M 814 112 L 814 236 L 340 236 L 340 112" stroke="#1a6b56" stroke-width="1.4" fill="none" marker-end="url(#review)"/>
    <text x="580" y="229" font-size="11" text-anchor="middle" fill="#1a6b56">the gate fetches: at the task's start, and on sokar task refresh</text>
    <path d="M 109 110 L 109 266 L 850 266 L 850 112" stroke="#b3261e" stroke-width="1.6" fill="none" stroke-dasharray="6 5" marker-end="url(#danger)"/>
    <text x="480" y="284" font-size="11.5" text-anchor="middle" fill="#b3261e">fetch it out of the mirror, push it yourself — past the approval, and the queue still says "waiting"</text>
    <text x="440" y="316" font-size="13.5" text-anchor="middle" fill="#24292f" font-weight="bold">guarded: nothing reaches the upstream before a person approved it</text>
  </g>
</svg>
