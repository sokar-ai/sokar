<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d">
  <title id="t">Sokar in one picture</title>
  <desc id="d">An AI coding agent sits in a locked cage on your machine. It cannot leave the cage and it holds no key. It reaches only the hosts named for it, its AI provider among them, and the host adds the key on the way out; everything else it tries is refused. In the default class its work comes out only as a branch that a person reviews and approves.</desc>

  <defs>
    <marker id="go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d6f"/>
    </marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0504d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" rx="12" fill="#ffffff"/>

  <g font-family="'Fira Sans','DejaVu Sans',sans-serif" stroke-linecap="round" stroke-linejoin="round">

    <!-- your machine -->
    <rect x="20" y="20" width="640" height="430" rx="14" fill="#f6f8f7" stroke="#b0bec5" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="40" y="46" font-size="13" fill="#78909c" font-family="'IBM Plex Mono',monospace" letter-spacing="1">YOUR MACHINE</text>

    <!-- things the agent may not reach -->
    <g>
      <rect x="64" y="70" width="128" height="40" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
      <text x="128" y="95" font-size="13" text-anchor="middle" fill="#455a64">other hosts</text>
      <rect x="216" y="70" width="128" height="40" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
      <text x="280" y="95" font-size="13" text-anchor="middle" fill="#455a64">your files</text>
      <rect x="368" y="70" width="128" height="40" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
      <text x="432" y="95" font-size="13" text-anchor="middle" fill="#455a64">~/.ssh, your keys</text>

      <path d="M200 178 L136 120" stroke="#c0504d" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#no)"/>
      <path d="M280 172 L280 120" stroke="#c0504d" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#no)"/>
      <path d="M360 178 L424 120" stroke="#c0504d" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#no)"/>
      <g stroke="#c0504d" stroke-width="3.5">
        <path d="M160 134 l12 12 M172 134 l-12 12"/>
        <path d="M274 134 l12 12 M286 134 l-12 12"/>
        <path d="M388 134 l12 12 M400 134 l-12 12"/>
      </g>
    </g>

    <!-- the cage -->
    <g>
      <rect x="180" y="176" width="200" height="150" rx="14" fill="#eceff1" stroke="#78909c" stroke-width="3"/>

      <!-- the agent -->
      <path d="M280 214 V204" stroke="#3f8f88" stroke-width="3"/>
      <circle cx="280" cy="200" r="5" fill="#f2a93b" stroke="#c9821f" stroke-width="2"/>
      <rect x="248" y="214" width="64" height="56" rx="16" fill="#4db6ac" stroke="#3f8f88" stroke-width="3"/>
      <circle cx="267" cy="238" r="7" fill="#fdfdfb" stroke="#2c5f5a" stroke-width="2"/>
      <circle cx="268" cy="239" r="3" fill="#2c5f5a"/>
      <circle cx="293" cy="238" r="7" fill="#fdfdfb" stroke="#2c5f5a" stroke-width="2"/>
      <circle cx="294" cy="239" r="3" fill="#2c5f5a"/>
      <path d="M268 255 q12 7 24 0" stroke="#2c5f5a" stroke-width="3" fill="none"/>
      <rect x="254" y="270" width="52" height="34" rx="9" fill="#4db6ac" stroke="#3f8f88" stroke-width="3"/>
      <text x="280" y="292" font-size="11" text-anchor="middle" fill="#ffffff" font-family="'IBM Plex Mono',monospace">AI</text>

      <!-- bars in front of it -->
      <g stroke="#78909c" stroke-width="4">
        <path d="M212 180 V322"/><path d="M240 180 V322"/><path d="M268 180 V322"/>
        <path d="M296 180 V322"/><path d="M324 180 V322"/><path d="M352 180 V322"/>
      </g>

      <!-- padlock -->
      <path d="M368 302 v-10 a12 12 0 0 1 24 0 v10" stroke="#c9821f" stroke-width="4" fill="none"/>
      <rect x="360" y="300" width="40" height="32" rx="6" fill="#f2a93b" stroke="#c9821f" stroke-width="3"/>
      <circle cx="380" cy="314" r="4" fill="#8a5a12"/>
      <path d="M380 316 v7" stroke="#8a5a12" stroke-width="3"/>
    </g>

    <!-- the host's broker, holding the key -->
    <g>
      <rect x="470" y="210" width="150" height="82" rx="10" fill="#ffffff" stroke="#2e7d6f" stroke-width="2"/>
      <text x="545" y="234" font-size="13" text-anchor="middle" fill="#1f5c52" font-weight="bold">Sokar on the host</text>
      <!-- key -->
      <circle cx="506" cy="262" r="9" fill="none" stroke="#c9821f" stroke-width="3.5"/>
      <path d="M515 262 H548 M538 262 v8 M546 262 v6" stroke="#c9821f" stroke-width="3.5" fill="none"/>
      <text x="584" y="267" font-size="11" text-anchor="middle" fill="#455a64">adds</text>
      <text x="584" y="281" font-size="11" text-anchor="middle" fill="#455a64">the key</text>
    </g>
    <path d="M384 236 L464 244" stroke="#2e7d6f" stroke-width="2.5" fill="none" marker-end="url(#go)"/>
    <text x="424" y="226" font-size="11" text-anchor="middle" fill="#2e7d6f">no key</text>

    <!-- the provider, outside -->
    <g>
      <path d="M716 270 a26 26 0 0 1 8 -50 a34 34 0 0 1 64 -6 a26 26 0 0 1 36 30 a22 22 0 0 1 -10 42 z" fill="#ffffff" stroke="#2e7d6f" stroke-width="2.5"/>
      <text x="768" y="252" font-size="13" text-anchor="middle" fill="#1f5c52">AI provider</text>
    </g>
    <path d="M624 250 L704 250" stroke="#2e7d6f" stroke-width="2.5" fill="none" marker-end="url(#go)"/>

    <!-- work comes back as a branch -->
    <path d="M300 330 C 310 380, 380 396, 452 396" stroke="#2e7d6f" stroke-width="2.5" fill="none" marker-end="url(#go)"/>
    <g>
      <rect x="460" y="374" width="150" height="44" rx="8" fill="#ffffff" stroke="#2e7d6f" stroke-width="2"/>
      <circle cx="482" cy="396" r="5" fill="#2e7d6f"/>
      <circle cx="500" cy="386" r="5" fill="#2e7d6f"/>
      <path d="M482 396 Q 488 386 495 386" stroke="#2e7d6f" stroke-width="2.5" fill="none"/>
      <text x="556" y="401" font-size="12" text-anchor="middle" fill="#1f5c52" font-family="'IBM Plex Mono',monospace">sokar/&lt;task&gt;</text>
    </g>
    <path d="M614 396 L700 396" stroke="#2e7d6f" stroke-width="2.5" fill="none" marker-end="url(#go)"/>

    <!-- you -->
    <g>
      <circle cx="736" cy="374" r="13" fill="#fdfdfb" stroke="#455a64" stroke-width="2.5"/>
      <path d="M712 418 a24 22 0 0 1 48 0" fill="#fdfdfb" stroke="#455a64" stroke-width="2.5"/>
      <circle cx="770" cy="384" r="14" fill="#2e7d6f"/>
      <path d="M763 384 l5 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none"/>
      <text x="742" y="440" font-size="13" text-anchor="middle" fill="#455a64">you approve</text>
    </g>

    <!-- the numbers, where each promise is kept -->
    <g font-size="12" text-anchor="middle" fill="#ffffff">
      <circle cx="412" cy="336" r="11" fill="#78909c"/><text x="412" y="341">1</text>
      <circle cx="484" cy="300" r="11" fill="#f2a93b"/><text x="484" y="305">2</text>
      <circle cx="226" cy="140" r="11" fill="#c0504d"/><text x="226" y="145">3</text>
      <circle cx="446" cy="372" r="11" fill="#2e7d6f"/><text x="446" y="377">4</text>
    </g>

    <!-- the four promises -->
    <g font-size="13.5" fill="#263238">
      <circle cx="700" cy="60" r="11" fill="#78909c"/><text x="700" y="65" font-size="12" text-anchor="middle" fill="#ffffff">1</text>
      <text x="720" y="65">It cannot leave</text>
      <circle cx="700" cy="92" r="11" fill="#f2a93b"/><text x="700" y="97" font-size="12" text-anchor="middle" fill="#ffffff">2</text>
      <text x="720" y="97">It holds no key</text>
      <circle cx="700" cy="124" r="11" fill="#c0504d"/><text x="700" y="129" font-size="12" text-anchor="middle" fill="#ffffff">3</text>
      <text x="720" y="129">Only named hosts</text>
      <circle cx="700" cy="156" r="11" fill="#2e7d6f"/><text x="700" y="161" font-size="12" text-anchor="middle" fill="#ffffff">4</text>
      <text x="720" y="161">You approve its work</text>
    </g>
  </g>
</svg>
