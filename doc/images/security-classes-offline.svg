<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-label="Offline: the agent clones from the local mirror and pushes back to it; there is no path to the upstream and the resolver answers nothing. The mirror is seeded once on the host, from the upstream or a checkout, and never fetched again.">
  <rect x="0" y="0" width="880" height="240" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8480f"/>
    </marker>
  </defs>
  <g font-family="'Fira Sans','DejaVu Sans',sans-serif">
    <rect x="16" y="22" width="404" height="164" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="30" y="42" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">NODE</text>
    <rect x="34" y="60" width="150" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="109" y="88" font-size="13" text-anchor="middle" fill="#24292f">Operator</text>
    <rect x="240" y="60" width="160" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="320" y="82" font-size="13" text-anchor="middle" fill="#24292f">Gate + mirror</text>
    <text x="320" y="98" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="'IBM Plex Mono',monospace">refs/sokar/incoming/…</text>
    <rect x="470" y="34" width="210" height="140" rx="8" fill="none" stroke="#e0a281"/>
    <text x="484" y="54" font-size="11" fill="#a8480f" font-family="'IBM Plex Mono',monospace">CONTAINER</text>
    <rect x="492" y="66" width="166" height="42" rx="6" fill="none" stroke="#a8480f"/>
    <text x="575" y="92" font-size="13" text-anchor="middle" fill="#a8480f">Agent</text>
    <text x="575" y="132" font-size="11" text-anchor="middle" fill="#57606a">resolver: everything NXDOMAIN</text>
    <text x="575" y="150" font-size="11" text-anchor="middle" fill="#57606a">firewall: the gate and nothing else</text>
    <rect x="726" y="60" width="136" height="46" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="794" y="88" font-size="13" text-anchor="middle" fill="#a0a8b0">Upstream</text>
    <text x="794" y="126" font-size="11" text-anchor="middle" fill="#a0a8b0">out of reach</text>
    <path d="M 794 140 L 794 206 L 320 206 L 320 112" stroke="#8c959f" stroke-width="1.4" fill="none" stroke-dasharray="2 4" marker-end="url(#ink)"/>
    <text x="557" y="224" font-size="11" text-anchor="middle" fill="#8c959f">seeded once on the host, from the upstream or a checkout, and never fetched again</text>
    <path d="M 404 74 L 486 74" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="66" font-size="11" text-anchor="middle" fill="#a8480f">clones</text>
    <path d="M 486 96 L 404 96" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="112" font-size="11" text-anchor="middle" fill="#a8480f">pushes</text>
    <path d="M 188 83 L 236 83" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#ink)"/>
    <text x="212" y="74" font-size="10.5" text-anchor="middle" fill="#57606a">reads</text>
  </g>
</svg>
