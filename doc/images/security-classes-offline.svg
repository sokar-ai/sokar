<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Offline: nothing of the code connects out. The agent clones from the local mirror and pushes back to it; the resolver answers nothing. The repository comes in as one file a person carries to the machine, and the work goes out the same way. The agent's model calls still reach its AI provider, through the host's broker, which adds the key.">
  <rect x="0" y="0" width="880" height="300" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8480f"/>
    </marker>
    <marker id="hand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6b56"/>
    </marker>
  </defs>
  <g font-family="'Fira Sans','DejaVu Sans',sans-serif">
    <rect x="16" y="22" width="684" height="164" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="30" y="42" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">NODE · NO ROUTE FOR THE CODE</text>
    <rect x="34" y="60" width="150" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="109" y="88" font-size="13" text-anchor="middle" fill="#24292f">Operator</text>
    <rect x="240" y="60" width="160" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="320" y="82" font-size="13" text-anchor="middle" fill="#24292f">Gate + mirror</text>
    <text x="320" y="98" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="'IBM Plex Mono',monospace">refs/sokar/incoming/…</text>
    <rect x="470" y="34" width="210" height="140" rx="8" fill="none" stroke="#e0a281"/>
    <text x="484" y="54" font-size="11" fill="#a8480f" font-family="'IBM Plex Mono',monospace">CONTAINER</text>
    <rect x="492" y="66" width="166" height="42" rx="6" fill="none" stroke="#a8480f"/>
    <text x="575" y="92" font-size="13" text-anchor="middle" fill="#a8480f">Agent</text>
    <text x="575" y="132" font-size="11" text-anchor="middle" fill="#57606a">resolver: everything NXDOMAIN</text>
    <text x="575" y="150" font-size="11" text-anchor="middle" fill="#57606a">firewall: the gate and nothing else</text>
    <path d="M 404 74 L 486 74" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="66" font-size="11" text-anchor="middle" fill="#a8480f">clones</text>
    <path d="M 486 96 L 404 96" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="445" y="112" font-size="11" text-anchor="middle" fill="#a8480f">pushes</text>
    <path d="M 188 83 L 236 83" stroke="#57606a" stroke-width="1.4" fill="none" marker-end="url(#ink)"/>
    <text x="212" y="74" font-size="10.5" text-anchor="middle" fill="#57606a">reads</text>
    <rect x="760" y="34" width="104" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="812" y="55" font-size="13" text-anchor="middle" fill="#24292f">AI provider</text>
    <text x="812" y="71" font-size="10.5" text-anchor="middle" fill="#57606a">the agent's model</text>
    <path d="M 662 80 L 756 58" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#ink)"/>
    <text x="706" y="16" font-size="10" text-anchor="middle" fill="#57606a">model calls only,</text>
    <text x="706" y="28" font-size="10" text-anchor="middle" fill="#57606a">key added on the host</text>
    <rect x="760" y="126" width="104" height="46" rx="6" fill="none" stroke="#1a6b56" stroke-dasharray="4 3"/>
    <text x="812" y="147" font-size="13" text-anchor="middle" fill="#24292f">One file</text>
    <text x="812" y="163" font-size="10.5" text-anchor="middle" fill="#57606a">carried by hand</text>
    <path d="M 812 176 L 812 216 L 300 216 L 300 112" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#hand)"/>
    <text x="556" y="209" font-size="11" text-anchor="middle" fill="#1a6b56">in: gate restore - the repository, with its history</text>
    <path d="M 340 112 L 340 246 L 840 246 L 840 178" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#hand)"/>
    <text x="590" y="239" font-size="11" text-anchor="middle" fill="#1a6b56">out: gate backup - the work, pending pushes included</text>
    <text x="440" y="286" font-size="13.5" text-anchor="middle" fill="#24292f" font-weight="bold">offline: the code comes in as a file and the work leaves the same way; only model calls reach the provider</text>
  </g>
</svg>
