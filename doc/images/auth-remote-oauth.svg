<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="An OAuth login driven from another machine. The browser on the laptop opens the authorization URL and is redirected to localhost on a port the ssh tunnel forwards to the node's listener, so the authorization code reaches the node. The node exchanges that code, using a verifier that never left it, for a token the provider delivers straight to the node. Sokar then imports it into the vault. The token never reaches the laptop, and the varlink socket never carries a secret at all.">
  <rect x="0" y="0" width="900" height="380" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="r-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="r-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a6b56"/>
    </marker>
    <marker id="r-tun" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8250df"/>
    </marker>
  </defs>
  <g font-family="'Fira Sans','DejaVu Sans',sans-serif">
    <rect x="16" y="66" width="330" height="190" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="30" y="86" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">LAPTOP</text>
    <rect x="40" y="100" width="150" height="44" rx="6" fill="none" stroke="#57606a"/>
    <text x="115" y="127" font-size="13" text-anchor="middle" fill="#24292f">Browser</text>
    <rect x="40" y="184" width="150" height="44" rx="6" fill="none" stroke="#57606a"/>
    <text x="115" y="211" font-size="13" text-anchor="middle" fill="#24292f">Sokar GUI</text>

    <rect x="420" y="66" width="320" height="190" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="434" y="86" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">NODE</text>
    <rect x="450" y="100" width="180" height="50" rx="6" fill="none" stroke="#57606a"/>
    <text x="540" y="120" font-size="13" text-anchor="middle" fill="#24292f">Agent login</text>
    <text x="540" y="137" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="'IBM Plex Mono',monospace">127.0.0.1:8484</text>
    <rect x="450" y="188" width="180" height="44" rx="6" fill="none" stroke="#57606a"/>
    <text x="540" y="215" font-size="13" text-anchor="middle" fill="#24292f">Vault</text>

    <rect x="790" y="122" width="96" height="60" rx="6" fill="none" stroke="#57606a"/>
    <text x="838" y="157" font-size="13" text-anchor="middle" fill="#24292f">Provider</text>

    <path d="M 196 108 L 280 108 L 280 34 L 838 34 L 838 116" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#r-ink)"/>
    <text x="560" y="26" font-size="11" text-anchor="middle" fill="#57606a">1 · the authorization URL — public, PKCE-protected</text>

    <path d="M 828 116 L 828 52 L 300 52 L 300 114 L 196 114" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#r-ink)"/>
    <text x="560" y="66" font-size="11" text-anchor="middle" fill="#57606a">2 · redirect to http://localhost:8484/…?code=…</text>

    <path d="M 40 122 L 28 122 L 28 300 L 540 300 L 540 156" stroke="#8250df" stroke-width="1.8" fill="none" marker-end="url(#r-tun)"/>
    <text x="300" y="292" font-size="11.5" text-anchor="middle" fill="#8250df">3 · the code, through the tunnel</text>
    <rect x="250" y="306" width="290" height="26" rx="5" fill="none" stroke="#8250df" stroke-dasharray="4 3"/>
    <text x="395" y="323" font-size="11" text-anchor="middle" fill="#8250df" font-family="'IBM Plex Mono',monospace">ssh -L 8484:localhost:8484</text>

    <path d="M 636 125 L 784 125" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#r-good)"/>
    <text x="710" y="117" font-size="10.5" text-anchor="middle" fill="#1a6b56">4 · code + verifier</text>
    <path d="M 784 145 L 636 145" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#r-good)"/>
    <text x="710" y="163" font-size="10.5" text-anchor="middle" fill="#1a6b56">the token — node only</text>

    <path d="M 540 156 L 540 182" stroke="#1a6b56" stroke-width="1.8" fill="none" marker-end="url(#r-good)"/>
    <text x="552" y="176" font-size="10.5" fill="#1a6b56" font-family="'IBM Plex Mono',monospace">vault import</text>

    <path d="M 196 206 L 444 206" stroke="#57606a" stroke-width="1.6" fill="none" marker-end="url(#r-ink)"/>
    <text x="318" y="198" font-size="10.5" text-anchor="middle" fill="#57606a">varlink over ssh — names, kinds, lengths</text>
    <text x="318" y="228" font-size="10.5" text-anchor="middle" fill="#b3261e">never a value, in either direction</text>

    <text x="450" y="360" font-size="12" text-anchor="middle" fill="#1a6b56">The token exists only on the node. What crossed to the laptop was a URL, and what crossed back was a single-use code.</text>
  </g>
</svg>
