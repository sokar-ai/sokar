<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="Online: the gate is out of the path, the agent clones from and pushes to the upstream itself, and any review happens afterwards on the forge.">
  <rect x="0" y="0" width="880" height="210" rx="8" fill="#ffffff"/>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8480f"/>
    </marker>
  </defs>
  <g font-family="'Fira Sans','DejaVu Sans',sans-serif">
    <rect x="16" y="22" width="404" height="164" rx="8" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="30" y="42" font-size="11" fill="#8c959f" font-family="'IBM Plex Mono',monospace">HOST</text>
    <rect x="34" y="60" width="150" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="109" y="88" font-size="13" text-anchor="middle" fill="#24292f">Operator</text>
    <rect x="240" y="60" width="160" height="46" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="5 4"/>
    <text x="320" y="82" font-size="13" text-anchor="middle" fill="#a0a8b0">Gate + mirror</text>
    <text x="320" y="98" font-size="10.5" text-anchor="middle" fill="#a0a8b0">not in the path</text>
    <rect x="470" y="34" width="210" height="140" rx="8" fill="none" stroke="#e0a281"/>
    <text x="484" y="54" font-size="11" fill="#a8480f" font-family="'IBM Plex Mono',monospace">CONTAINER</text>
    <rect x="492" y="66" width="166" height="42" rx="6" fill="none" stroke="#a8480f"/>
    <text x="575" y="92" font-size="13" text-anchor="middle" fill="#a8480f">Agent</text>
    <text x="575" y="132" font-size="11" text-anchor="middle" fill="#a8480f">ssh-agent socket</text>
    <text x="575" y="150" font-size="11" text-anchor="middle" fill="#57606a">the key stays in the vault</text>
    <rect x="726" y="60" width="136" height="46" rx="6" fill="none" stroke="#57606a"/>
    <text x="794" y="88" font-size="13" text-anchor="middle" fill="#24292f">Upstream</text>
    <path d="M 722 74 L 686 74" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="704" y="64" font-size="11" text-anchor="middle" fill="#a8480f">clones</text>
    <path d="M 686 96 L 722 96" stroke="#a8480f" stroke-width="1.6" fill="none" marker-end="url(#agent)"/>
    <text x="704" y="112" font-size="11" text-anchor="middle" fill="#a8480f">pushes</text>
    <path d="M 109 110 L 109 178 L 794 178 L 794 112" stroke="#57606a" stroke-width="1.4" fill="none" stroke-dasharray="2 4" marker-end="url(#ink)"/>
    <text x="450" y="196" font-size="11.5" text-anchor="middle" fill="#57606a">review — if at all, afterwards on the forge</text>
  </g>
</svg>
