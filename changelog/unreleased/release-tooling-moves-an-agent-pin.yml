title: "`sokar-release` now carries an agent's update pipeline: `upstream-version` says whether upstream moved and answers `rollback` rather than `yes` for an older one, `update` pins a version with the digest read from the vendor and never from the caller, and `check-pin` checks that the built definition, the pom and the published digest agree. What differs between agents - where upstream and the digest are read, the label, an npm tree's relock - is read from `sokar.release.*` properties in the calling repository's pom, so the three agents run one implementation."
type: added
