title: "A task the machine's restart took down comes back whole when it is started: what is knowledge about it is saved where a reboot does not reach, its gate token and the provider's stand-in token are kept in the vault (hidden from every credential listing, removed with the task), and 'start' puts them back and continues its session; 'task list' says which tasks the restart took down. A locked vault is named rather than half a task started. Also fixed: a resumed task's relay entered the old container's namespace, and its ssh-agent was never started again."
type: added
