title: "`sokar-release` also writes the bills the comparison reads: `add-fetched-cli` records the CLI an image build fetches, read from the agent definition with Sokar's own reader rather than a pattern over its text, and refuses to guess when a definition pins more than one artifact; `merge-tree-bill` nests a shipped tree under the component that carries it, and fails the build if the written bill is missing any component of the two it merged."
type: added
