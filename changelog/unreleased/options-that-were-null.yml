title: "Fixed what nullness checking found: 'sokar doctor' reports a record of followed projects it cannot read instead of failing; 'sokar shield egress' without --project, and 'sokar talk pass' without --project, say so instead of looking for a project called null; 'shield egress --task --also-project' names the file it wrote; 'vault serve' refuses to start without --token-file and --pid-file; an online project without an upstream is refused with a sentence; a machine without libkeyutils is told so."
type: fixed
