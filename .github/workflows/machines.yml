# The machines a CI leg boots from, kept current - for this repository's legs and every agent
# repository's, which boot the same snapshots.
name: Machines

on:
  # Daily: a release becomes old enough on a day of its own, not on the day it was published.
  schedule:
    - cron: '17 5 * * *'
  # A merged move rebuilds the snapshots from what it pins.
  push:
    branches: [main]
    paths: ['buildtools/hetzner/pom.xml']
  workflow_dispatch:

# Never two at once: two refreshes would open the same pull request, two rebuilds rent twice.
concurrency:
  group: ${{ github.workflow }}

jobs:

  # One pull request per pin that has a release at least three days old (the pom's
  # sokar.release.min-age), and never an older one instead of a newer that is too young.
  refresh:
    name: Ask upstream
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Build the release tooling
        run: |
          ./mvnw -B -q -s settings.xml -pl buildtools/release -am install -DskipTests
          ./mvnw -B -q -s settings.xml -pl buildtools/release dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      # A pin whose question cannot be answered fails the job - "could not tell" is not "up to date" -
      # after the others have been asked.
      - name: Open a pull request per moved pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          release() {
              java -cp "buildtools/release/target/classes:$(cat buildtools/release/target/cp.txt)" \
                  org.fuin.sokar.release.Main "$@"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          failed=0
          for pin in graalvm ubuntu-image alpine-image; do
              git checkout -q main
              if ! answer=$(release upstream-version --pom buildtools/hetzner/pom.xml --pin "$pin"); then
                  echo "::error::could not tell whether $pin has moved"
                  failed=1
                  continue
              fi
              echo "$answer"
              update=$(printf '%s\n' "$answer" | sed -n 's/^update=//p')
              upstream=$(printf '%s\n' "$answer" | sed -n 's/^upstream=//p')
              if [ "$update" != yes ]; then
                  continue
              fi
              # An image's "version" is its digest; the branch names its start.
              branch="machines/$pin-$(printf '%s' "${upstream#sha256:}" | cut -c1-16)"
              if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
                  echo "$branch is open already"
                  continue
              fi
              git checkout -q -b "$branch"
              if ! release update "$upstream" --pin "$pin" --pom buildtools/hetzner/pom.xml; then
                  echo "::error::could not move $pin to $upstream"
                  failed=1
                  continue
              fi
              git commit -q -am "Pin $pin $upstream"
              git push -q origin "$branch"
              gh pr create --base main --head "$branch" --title "Pin $pin $upstream" --body "$(printf \
                  'The machines a CI leg boots from: %s moves to %s, published %s.\n\nMerging it rebuilds the snapshots.\n\n```\n%s\n```' \
                  "$pin" "$upstream" "$(printf '%s\n' "$answer" | sed -n 's/^published=//p')" "$answer")"
          done
          exit "$failed"

  # Only when a merged change moved what a snapshot is made of: the pom changes for other reasons too.
  snapshots:
    name: Snapshot - ${{ matrix.os }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, fedora]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Did a pin move?
        id: moved
        run: |
          if git diff HEAD~1 HEAD -- buildtools/hetzner/pom.xml | grep -Eq '^[-+][[:space:]]*<machines\.'; then
              echo "moved=yes" >> "$GITHUB_OUTPUT"
          else
              echo "moved=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        if: steps.moved.outputs.moved == 'yes'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Build the machine tooling
        if: steps.moved.outputs.moved == 'yes'
        run: |
          ./mvnw -B -q -s settings.xml -pl buildtools/hetzner -am install -DskipTests
          ./mvnw -B -q -s settings.xml -pl buildtools/hetzner dependency:build-classpath \
              -Dmdep.outputFile=target/cp.txt

      # Proven by building the product on it before it is taken; a leg takes the newest snapshot.
      - name: Build the ${{ matrix.os }} snapshot
        if: steps.moved.outputs.moved == 'yes'
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          HETZNER_SSH: ${{ secrets.HETZNER_SSH }}
          SOKAR_CI_LEG: snapshot-${{ matrix.os }}
        run: |
          java -cp "buildtools/hetzner/target/classes:$(cat buildtools/hetzner/target/cp.txt)" \
              org.fuin.sokar.machines.Main snapshot --os ${{ matrix.os }} --repo .

      - name: Delete what this run created
        if: always() && steps.moved.outputs.moved == 'yes'
        env:
          HETZNER_API: ${{ secrets.HETZNER_API }}
          SOKAR_CI_LEG: snapshot-${{ matrix.os }}
        run: |
          java -cp "buildtools/hetzner/target/classes:$(cat buildtools/hetzner/target/cp.txt)" \
              org.fuin.sokar.machines.Main sweep --mine
