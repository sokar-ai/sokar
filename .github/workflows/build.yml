# What a change proves, and where.
#
#   every push and pull request   build and unit tests, on a GitHub-hosted runner. Free, no
#                                 secrets, works for a fork - and the only thing a fork's
#                                 changes get.
#
#   merged to main                the acceptance suite, on two rented machines in parallel,
#                                 then the publish.
#
# Publishing runs here rather than on a rented machine: an artifact anyone resolves must not come
# from a box that exists for ten minutes and is then destroyed. Two modules are published, the
# agent API and the wire it needs; everything else has maven.deploy.skip on by default.
#
# Both acceptance legs run the same suite on a Hetzner server booted from a prepared snapshot, in parallel:
#
#   fedora    SELinux enforcing, with Sokar's own policy module loaded. The only place that is
#             tested at all - a hosted runner is Ubuntu with AppArmor and cannot enable SELinux.
#
#   ubuntu    AppArmor, and podman 4 as 24.04 LTS ships it. Not redundant: the git gate was
#             firewalled off for every user on podman 4, and neither development VM could see it
#             because both run podman 5.
#
# Why not a hosted runner. Measured: 858s there against 320s on a cpx42, and the 320s includes
# creating the machine and destroying it afterwards. Two cores is the whole difference - 634s of
# that 858s was native-image. Running here also means full optimisation rather than -Ob, so a
# pull request builds the same binary as main.
#
# About two cents a push for both servers, and each destroys itself. A run that is cancelled
# cannot, which is what .github/workflows/sweep.yml is for.
#
# Tier 2 needs a real provider credential and spends money per run, so it is not here yet.
name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# One run per branch. Without this every push leaves its predecessor running to completion on a
# commit nobody cares about any more - and a cancelled run leaks its server, which is why the
# scheduled sweep exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Every push and every pull request, including from a fork. Free, needs no secrets, and it is
  # the only thing a fork's changes get until someone merges them - so it has to be worth having
  # on its own.
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      # -s settings.xml so a developer's own ~/.m2/settings.xml cannot be what makes a build
      # work here. It is also where the snapshot repository is declared, for when something
      # upstream is one.
      - name: Build and unit tests
        run: ./mvnw -B verify -s settings.xml

  # Only what has landed on main, plus a manual run. Every leg here rents a machine, so a branch
  # that is still being pushed to would spend money on each revision - and a pull request from a
  # fork cannot see the secrets anyway. What guards a pull request is the job above.
  tier1:
    name: Tier 1 - ${{ matrix.os }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    strategy:
      # One leg failing must not cancel the other - which of them fails is usually the finding.
      fail-fast: false
      matrix:
        os: [fedora, ubuntu]

    steps:
      - uses: actions/checkout@v7

      - name: Install the Hetzner client
        run: pip install --quiet hcloud

      # Two things come from the environment and neither is written down here: REMOTE_BUILD, the
      # API token, and SSH, the private key that reaches the servers it creates. The key goes into
      # an ssh-agent rather than onto a filesystem, and the matching key in the Hetzner project is
      # found by fingerprint - so nothing has to keep a key name in step with the secret.
      #
      # The server is destroyed by the script itself, in a finally.
      - name: Tier 1 on ${{ matrix.os }}
        env:
          REMOTE_BUILD: ${{ secrets.REMOTE_BUILD }}
          SSH: ${{ secrets.SSH }}
          # Both matrix legs share GITHUB_RUN_ID, so the leg is what makes a server's label
          # unique - and the cleanup below deletes by that label.
          SOKAR_CI_LEG: ${{ matrix.os }}
        run: python3 buildtools/ci/remote-tier1.py --os ${{ matrix.os }}

      # Only what this run made. Deleting by age would catch another run's server whenever that
      # run is slower than the window, and the symptom - ssh dying part way through a build - is
      # close to undebuggable.
      - name: Delete what this run created
        if: always()
        env:
          REMOTE_BUILD: ${{ secrets.REMOTE_BUILD }}
          SOKAR_CI_LEG: ${{ matrix.os }}
        run: python3 buildtools/ci/sweep.py --mine

  # Snapshots of the agent API, so an agent repository can build against it without a checkout of
  # this one. After tier 1 on purpose: a published snapshot that fails the acceptance suite is
  # worse than no snapshot, and waiting costs nothing that is not already being spent.
  #
  # Four secrets, none of them written down here: OSS_SONATYPE_USERNAME and OSS_SONATYPE_TOKEN
  # authenticate to Central, OSS_SONATYPE_GPG_PRIVATE_KEY and OSS_SONATYPE_GPG_PASSPHRASE sign
  # what is uploaded. Central rejects an unsigned artifact, so a missing key fails the job
  # rather than publishing something unusable.
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, tier1]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'maven'

      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}

      # One build for both destinations: the jars Sonatype gets and the binaries the
      # packages carry come out of the same reactor run, so they cannot disagree.
      - name: Deploy the jars, and build the packages
        env:
          OSS_SONATYPE_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          OSS_SONATYPE_TOKEN: ${{ secrets.OSS_SONATYPE_TOKEN }}
          OSS_SONATYPE_GPG_PASSPHRASE: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}
        run: ./mvnw -B clean deploy -Pcentral-sonatype-release,native,dist -s settings.xml

      # Checks the two packages against each other and installs both in a clean Debian and
      # a clean Fedora container. Before the upload, not after: a package that does not
      # install is worth catching here rather than in an operator's apt.
      - name: Check the packages
        run: ./buildtools/check-packages.sh

      - uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      # 'snapshots' rather than 'stable' until there is a release. A consumer chooses which
      # by the word in their sources.list, so the two never mix.
      #
      # The three deb.* properties are not decoration: without them Artifactory stores the
      # file and never indexes it, apt sees nothing, and no error is reported anywhere.
      # Setting them needs Annotate permission on the repository as well as Deploy.
      - name: Publish the packages
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
        run: |
          set -eux
          jf rt upload "dist-deb/target/*.deb" "sokar-dist-deb/pool/main/s/sokar/" \
              --target-props="deb.distribution=snapshots;deb.component=main;deb.architecture=amd64" \
              --build-name=sokar --build-number="$GITHUB_RUN_ID"
          jf rt upload "dist-rpm/target/*.rpm" "sokar-dist-rpm/snapshots/" \
              --build-name=sokar --build-number="$GITHUB_RUN_ID"
          jf rt build-add-git sokar "$GITHUB_RUN_ID"
          jf rt build-publish sokar "$GITHUB_RUN_ID"
