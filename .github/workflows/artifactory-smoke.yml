# Does Artifactory answer, and can this token actually do what the publish step needs? Manual.
name: Artifactory smoke test

on:
  workflow_dispatch:

jobs:

  smoke:
    name: Reachable, authorized, writable
    runs-on: ubuntu-latest

    env:
      JF_URL: ${{ vars.JF_URL }}
      JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
      DEB_REPO: sokar-dist-deb
      RPM_REPO: sokar-dist-rpm

    steps:
      - name: The settings exist at all
        run: |
          set -eu
          [ -n "${JF_URL:-}" ] || { echo "::error::variable JF_URL is not set"; exit 1; }
          [ -n "${JF_ACCESS_TOKEN:-}" ] || { echo "::error::secret JF_ACCESS_TOKEN is not set"; exit 1; }
          case "$JF_URL" in
              */artifactory|*/artifactory/)
                  echo "::error::JF_URL is the PLATFORM url and must not end in /artifactory"
                  exit 1 ;;
          esac
          echo "  OK    JF_URL is set and is a platform url"

      - uses: jfrog/setup-jfrog-cli@68c0efdc951dd2359bbbfa15c48bc67b3ae8e4d6 # v5.2.0
        with:
          disable-auto-build-publish: true

      - name: Artifactory answers, and the token authenticates
        run: jf rt ping

      # A repository of the wrong type accepts uploads and indexes nothing.
      - name: Both repositories exist and are the right type
        run: |
          set -eu
          # 'rpm' is what the API reports;
          check_type() {
              repo="$1"; shift
              got="$(jf rt curl -s -XGET "/api/repositories/$repo" \
                  | jq -r '.packageType // "MISSING"' | tr 'A-Z' 'a-z')"
              for want in "$@"; do
                  if [ "$got" = "$want" ]; then
                      echo "  OK    $repo is a '$got' repository"
                      return 0
                  fi
              done
              echo "::error::$repo has packageType '$got', expected one of: $*"
              return 1
          }
          check_type "$DEB_REPO" debian
          check_type "$RPM_REPO" rpm yum

      # No signing key means no InRelease, and apt refuses the repository - with an error that reads as.
      - name: What the API says about signing
        run: |
          set -eu
          for repo in "$DEB_REPO" "$RPM_REPO"; do
              body="$(jf rt curl -s -XGET "/api/repositories/$repo")"
              key="$(echo "$body" | jq -r '.primaryKeyPairRef // ""')"
              if [ -n "$key" ]; then
                  echo "  OK    $repo reports keypair '$key'"
              else
                  echo "  ??    $repo reports no keypair. If the UI shows one, this token"
                  echo "        simply cannot see the field. Fields it did return:"
                  echo "$body" | jq -r 'keys[]' | tr '\n' ' ' | sed 's/^/          /'
                  echo
              fi
          done

      # Deploy, Annotate and Delete are three separate permissions and all three are needed.
      - name: The token can write, annotate and delete
        run: |
          set -eu
          echo "sokar smoke ${GITHUB_RUN_ID}" > smoke.txt
          FAILED=0
          for repo in "$DEB_REPO" "$RPM_REPO"; do
              path="$repo/.smoke/${GITHUB_RUN_ID}.txt"

              jf rt upload smoke.txt "$path" --flat=true >/dev/null
              echo "  OK    $repo accepts an upload"

              jf rt sp "$path" "smoke=${GITHUB_RUN_ID}" >/dev/null
              got="$(jf rt curl -s -XGET "/api/storage/$path?properties" \
                  | jq -r '.properties.smoke[0] // ""')"
              if [ "$got" = "$GITHUB_RUN_ID" ]; then
                  echo "  OK    $repo stores properties, so Annotate is granted"
              else
                  echo "::error::$repo dropped the property - the token lacks Annotate, and a .deb would upload and never be indexed"
                  FAILED=1
              fi

              jf rt del "$path" --quiet >/dev/null
              echo "  OK    $repo allows delete, so the probe left nothing behind"
          done
          rm -f smoke.txt
          exit "$FAILED"
