# Deletes test servers that a run could not clean up after itself.
#
# The one case buildtools/ci/remote-tier1.py cannot cover: a job cancelled between two statements
# never reaches its finally. That has happened - two pushes in quick succession, the first run
# cancelled by cancel-in-progress, and its server left billing at 0.111 EUR/hour, which is
# 81 EUR a month if nobody notices.
#
# Hourly, and by age: anything older than an hour is either forgotten or a run so slow it wants
# looking at. A run cleaning up after itself uses --mine instead, which cannot race this.
name: Sweep abandoned test servers

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Hetzner client
        run: pip install --quiet hcloud

      - name: Delete anything older than an hour
        env:
          REMOTE_BUILD: ${{ secrets.REMOTE_BUILD }}
        run: python3 buildtools/ci/sweep.py --older-than 60 --now
